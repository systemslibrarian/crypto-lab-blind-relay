name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This lab CONSUMES the hub's HPKE module (crypto-lab-hpke-envelope)
      # rather than forking it. actions/checkout can only write inside the
      # workspace, so it lands in ./hub/ — vite.config.ts and tsconfig.json
      # look there when the local sibling checkout is absent.
      - name: Check out the hub HPKE module
        uses: actions/checkout@v4
        with:
          repository: systemslibrarian/crypto-lab-hpke-envelope
          path: hub/crypto-lab-hpke-envelope
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA, both themes)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
